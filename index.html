<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Metadata -->
    <title>Rizqoraa Solutions | Global Language Solutions & AI Localization</title>
    <meta name="description" content="Rizqoraa Solutions provides global translation, localization, multilingual content, linguistic quality assurance, subtitling, transcription, and AI language solutions for businesses worldwide." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" id="canonical-url" href="https://rizqoraa.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rizqoraa.com/" />
    <meta property="og:title" content="Rizqoraa Solutions | Global Language Solutions & AI Localization" />
    <meta property="og:description" content="Rizqoraa Solutions provides global translation, localization, multilingual content, linguistic quality assurance, subtitling, transcription, and AI language solutions for businesses worldwide." />
    <meta property="og:image" content="https://rizqoraa.com/rizqoraalogo.png" />
    <meta property="og:site_name" content="Rizqoraa Solutions" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://rizqoraa.com/" />
    <meta name="twitter:title" content="Rizqoraa Solutions | Global Language Solutions & AI Localization" />
    <meta name="twitter:description" content="Rizqoraa Solutions provides global translation, localization, multilingual content, linguistic quality assurance, subtitling, transcription, and AI language solutions for businesses worldwide." />
    <meta name="twitter:image" content="https://rizqoraa.com/rizqoraalogo.png" />

    <!-- Structured Data (Schema.org Organization & WebSite JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://rizqoraa.com/#organization",
          "name": "Rizqoraa Solutions",
          "url": "https://rizqoraa.com/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://rizqoraa.com/rizqoraalogo.png"
          },
          "description": "Rizqoraa Solutions provides global translation, localization, multilingual content, linguistic quality assurance, subtitling, transcription, and AI language solutions for businesses worldwide.",
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer service",
            "email": "enterprise@Rizqoraasolutions.com"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://rizqoraa.com/#website",
          "url": "https://rizqoraa.com/",
          "name": "Rizqoraa Solutions",
          "publisher": {
            "@id": "https://rizqoraa.com/#organization"
          }
        }
      ]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-white text-[#141414] antialiased selection:bg-[#E4032E] selection:text-white font-['Plus_Jakarta_Sans',sans-serif]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
